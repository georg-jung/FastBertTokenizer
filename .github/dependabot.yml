version: 2
updates:
- package-ecosystem: nuget
  directory: "/"
  schedule:
    interval: daily
  groups:
    nuget:
      # One PR for all non-breaking NuGet updates; majors stay separate.
      patterns:
      - "*"
      update-types:
      - minor
      - patch
  ignore:
  # Deliberately held at the lowest patched 8.x version, see Directory.Packages.props.
  - dependency-name: System.Text.Json
    update-types:
    - version-update:semver-major
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: daily
  groups:
    github-actions:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
- package-ecosystem: "docker"
  directories:
  - "/src/HuggingfaceTokenizer/Rest"
  schedule:
    interval: "daily"
  groups:
    docker:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
- package-ecosystem: pip
  directories:
  - "/src/HuggingfaceTokenizer/BenchPython"
  - "/src/HuggingfaceTokenizer/Rest"
  schedule:
    interval: weekly
  groups:
    python:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
- package-ecosystem: cargo
  directories:
  - "/src/HuggingfaceTokenizer/BenchRust"
  - "/src/HuggingfaceTokenizer/RustLib"
  schedule:
    interval: weekly
  groups:
    rust:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
