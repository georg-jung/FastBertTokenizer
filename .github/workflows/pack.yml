name: Pack

# Releasing:
#   1. Push a version tag, e.g. `nbgv tag release/v1.3` and `git push origin v1.3.4`. The run for the tag builds the
#      package, attests its build provenance and creates a draft GitHub release with the packages attached.
#   2. Add the release notes to the draft and publish it, e.g. `gh release edit v1.3.4 --notes-file notes.md --draft=false`.
#      Releases are immutable, so publishing locks the tag and the attached packages.
#   3. Publishing triggers another run, which pushes exactly the attached, attested packages to nuget.org and deploys the docs.

on:
  workflow_call:
    inputs:
      build-ref:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      docs:
        description: "Set to 'yes' to deploy docfx to GitHub Pages."
        required: false
        default: "no"
  push:
  release:
    types: [published]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    # Expose the docs version as a job-level output
    outputs:
      doc_version: ${{ steps.nbgv.outputs.SemVer2 }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
        lfs: true
    - uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    - name: Setup dotnet
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - uses: dotnet/nbgv@v0.5
      id: nbgv

    - run: dotnet restore src/FastBertTokenizer/FastBertTokenizer.csproj /p:ContinuousIntegrationBuild=true
    - run: dotnet tool install -g docfx
    - run: docfx docfx/docfx.json
    - uses: actions/upload-artifact@v7
      with:
        name: FastBertTokenizer-docs-${{ steps.nbgv.outputs.SemVer2 }}
        path: docfx/_site/**/*

    # To be sure we don't pack the docfx build, this comes after docfx
    - run: dotnet build src/FastBertTokenizer/FastBertTokenizer.csproj -c Release --no-restore /p:ContinuousIntegrationBuild=true

    - run: dotnet pack src/FastBertTokenizer/FastBertTokenizer.csproj -c Release --no-restore --no-build /p:ContinuousIntegrationBuild=true
    - uses: actions/upload-artifact@v7
      with:
        name: FastBertTokenizer-nupkg-${{ steps.nbgv.outputs.SemVer2 }}
        path: bin/Packages/Release/**/*

  #########################################################################
  # ATTEST Job (runs only for pushed version tags)
  #########################################################################
  attest:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

    name: Attest build provenance
    runs-on: ubuntu-24.04
    needs: build

    # Kept out of the build job, so no step that builds the package can request an OIDC token.
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: FastBertTokenizer-nupkg-${{ needs.build.outputs.doc_version }}
          path: packages

      # nuget.org adds a repository signature to every package, which changes the .nupkg's hash.
      # The assemblies inside stay byte-identical, so attest them too to keep downloads from nuget.org verifiable.
      - name: Extract assemblies
        run: |
          for pkg in packages/*.nupkg; do
            unzip -q "$pkg" 'lib/*/FastBertTokenizer.dll' -d assemblies
          done

      - name: Generate build provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            packages/*.nupkg
            packages/*.snupkg
            assemblies/lib/*/FastBertTokenizer.dll

  #########################################################################
  # DRAFT Release Job (runs only for pushed version tags)
  #########################################################################
  draft-release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

    name: Create draft release
    runs-on: ubuntu-24.04
    needs: [build, attest]

    permissions:
      contents: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: FastBertTokenizer-nupkg-${{ needs.build.outputs.doc_version }}
          path: packages

      # Assets can only be attached before publishing, as releases are immutable.
      # A re-run replaces the assets of an existing draft, but never touches a published release.
      - name: Create draft release with packages attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          draft=$(gh api "repos/$GH_REPO/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .draft")
          if [ -z "$draft" ]; then
            prerelease=()
            if [[ "$TAG" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$TAG" packages/* --draft --verify-tag --title "$TAG" \
              --notes "Add the release notes before publishing." "${prerelease[@]}"
          elif [ "$draft" = "true" ]; then
            gh release upload "$TAG" packages/* --clobber
          else
            echo "::error::Release $TAG is already published; its assets can't be changed."
            exit 1
          fi

  #########################################################################
  # PUBLISH NuGet Job (runs only on a published release)
  #########################################################################
  publish-nuget:
    if: ${{ github.event_name == 'release' }}

    name: Publish to nuget.org
    runs-on: ubuntu-24.04

    # The nuget.org trusted publishing policy is restricted to this environment.
    environment: nuget

    permissions:
      contents: read
      id-token: write
      attestations: read

    steps:
      # Publish exactly what is attached to the immutable release, not a rebuild of it.
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release download "$TAG" --pattern '*.nupkg' --pattern '*.snupkg' --dir packages

      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for pkg in packages/*; do
            gh attestation verify "$pkg" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/pack.yml" \
              --source-ref "refs/tags/$TAG"
          done

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
      - name: NuGet login (OIDC → temporary API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: georgjung

      # Pushes the .snupkg next to each .nupkg along with it.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  #########################################################################
  # DEPLOY Docs Job (runs only if release event OR if "docs: yes" manually)
  #########################################################################
  deploy-docs:
    # Condition:
    #   1) if it's a RELEASE event, OR
    #   2) if it's a manual dispatch with docs == 'yes'
    # Otherwise, skip
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.docs == 'yes') }}

    name: Deploy docfx to GitHub Pages
    runs-on: ubuntu-24.04
    needs: build

    # Pages deployment requires these permissions
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v8
        with:
          name: FastBertTokenizer-docs-${{ needs.build.outputs.doc_version }}
          path: docs

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
